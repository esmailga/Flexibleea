name: flexibleea
description: Flexibleea - a freelancer marketplace where freelancers set their own pay rate, dates and hours.
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5

  # State & persistence
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  font_awesome_flutter: ^10.8.0
  cupertino_icons: ^1.0.8

  # Device integrations
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
